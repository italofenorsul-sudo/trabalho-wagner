<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página não encontrada - SCL Goiana</title>
    <style>
        :root {
            --primary: #0066cc;
            --primary-dark: #003e80;
            --accent-yellow: #ffb800;
            --bg-body: #f4f6f9;
            --text-main: #1f2937;
            --text-muted: #6b7280;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
        }
        .card {
            max-width: 420px;
        }
        .codigo {
            font-size: 5rem;
            font-weight: 900;
            color: var(--primary);
            line-height: 1;
        }
        h1 { font-size: 1.3rem; margin: 16px 0 8px; color: var(--primary-dark); }
        p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 24px; }
        a.btn {
            display: inline-block;
            background: var(--accent-yellow);
            color: #000;
            font-weight: 700;
            padding: 10px 20px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="codigo">404</div>
        <h1>Página não encontrada</h1>
        <p>O endereço acessado não existe no Sistema de Licitações (SCL). Verifique o link ou volte para a página inicial.</p>
        <a class="btn" href="index.html">Voltar ao início</a>
    </div>
</body>
</html>
